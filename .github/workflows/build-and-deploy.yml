name: Build and deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: swift:6.2
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: swift run

      - name: Add CNAME
        run: echo "www.holtvedt.com" > Build/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Build

      - id: deployment
        uses: actions/deploy-pages@v4
